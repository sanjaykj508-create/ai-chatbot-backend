```
<div class="chat-container">

    <div class="header">
        <h2>🤖 KJ AI Assistant</h2>
        <p>Powered by Google Gemini</p>
    </div>

    <div class="chat-box" id="chatBox">
        <div class="message bot">
            Hi! 👋 I'm your AI assistant. How can I help you?
        </div>
    </div>

    <div class="input-area">
        <input
            type="text"
            id="messageInput"
            placeholder="Type your message..."
            autocomplete="off"
        />

        <button id="sendButton">Send</button>
    </div>

</div>

<script>
    const chatBox = document.getElementById("chatBox");
    const messageInput = document.getElementById("messageInput");
    const sendButton = document.getElementById("sendButton");

    // One conversation ID keeps the conversation history together
    const conversationId = "frontend-user-001";

    function addMessage(message, type) {
        const div = document.createElement("div");
        div.className = `message ${type}`;

        // Basic formatting for markdown-style bold text
        message = message.replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>");

        div.innerHTML = message.replace(/\n/g, "<br>");

        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function sendMessage() {
        const message = messageInput.value.trim();

        if (!message) {
            return;
        }

        addMessage(message, "user");

        messageInput.value = "";
        sendButton.disabled = true;
        sendButton.textContent = "Sending...";

        try {
            const url =
                `http://127.0.0.1:8000/chat?conversation_id=${encodeURIComponent(conversationId)}&message=${encodeURIComponent(message)}`;

            const response = await fetch(url);

            if (!response.ok) {
                throw new Error("Server error");
            }

            const data = await response.json();

            addMessage(data.response, "bot");

        } catch (error) {
            addMessage(
                "❌ Unable to connect to the backend. Make sure the FastAPI server is running.",
                "bot"
            );
        }

        sendButton.disabled = false;
        sendButton.textContent = "Send";
        messageInput.focus();
    }

    sendButton.addEventListener("click", sendMessage);

    messageInput.addEventListener("keydown", function(event) {
        if (event.key === "Enter") {
            sendMessage();
        }
    });
</script>
